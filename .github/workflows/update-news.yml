
name: Nieuws automatisch vernieuwen

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7,17 * * *'

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Bestanden ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Nieuws ophalen
        run: python update_news.py

      - name: Nieuws opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Automatische nieuwsupdate"
            git push
          fi
  
